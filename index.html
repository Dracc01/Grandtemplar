function fl(id,box,key,fx,fy){var el=$(id),o=FL[key]={el:el,bx:$(box),x:0,y:0,vx:0,vy:0,rot:0,dn:0,init:0,w:0,h:0,ph:Math.random()*6},p=S.pos[key];o.fx=p?p.x:fx;o.fy=p?p.y:fy;

o.rot+=(Math.max(-9,Math.min(9,o.vx*1.4))-o.rot)*.12;var s=t/1000+o.ph,a=k=="lg"?0:1;
e.style.transform="translate("+(o.x+Math.sin(s*.9)*3*a).toFixed(1)+"px,"+(o.y+Math.cos(s*1.2)*5*a).toFixed(1)+"px) rotate("+o.rot.toFixed(2)+"deg)"}}

var s="",k,i,p,th,r,an;for(k=0;k<3;k++){p=[];for(i=0;i<=120;i++){th=i/120*Math.PI*5;r=3+th*8.2;an=th+k*2.0944;p.push((r*Math.cos(an)).toFixed(1)+","+(r*Math.sin(an)).toFixed(1))}
s+='<polyline points="'+p.join(" ")+'" fill="none" stroke="'+(k?"#d6d9d5":"#a6f04d")+'" stroke-opacity="'+(k?.4:.6)+'" stroke-width="2.4" stroke-linecap="round"/>'}
v.innerHTML=s;
var A=450,B=700,C=600,T=A+B+C,t0=0,done=0,E=function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},M=function(x){return Math.max(0,Math.min(1,x))};

function f(t){if(done)return;if(!t0)t0=t;var m=t-t0,a=E(M(m/A)),b=M((m-A)/B),eb=E(b),c=M((m-A-B)/C),ec=E(c),sc=(.9+.1*a)*(1-.92*eb);

g.style.transform="translate(-50%,-50%) rotate("+(eb*720).toFixed(1)+"deg) scale("+sc.toFixed(3)+")";
v.style.opacity=(M(b*1.6)*(1-ec)).toFixed(3);
v.style.transform="translate(-50%,-50%) rotate("+(-(b+c)*540).toFixed(1)+"deg) scale("+(.1+eb*.9+ec*1.2).toFixed(3)+")";
if(c>0){var R=ec*Math.hypot(innerWidth,innerHeight)/2*1.05,mk="radial-gradient(circle at 50% 50%,transparent "+R.toFixed(0)+"px,#000 "+(R+3).toFixed(0)+"px)";sp.style.webkitMaskImage=mk;sp.style.maskImage=mk}
if(m>=T)end();else requestAnimationFrame(f)}
